<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Smallcontrol demo: embedded</title>
    <meta name="author" content="Martijn De Jongh (Martino)">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="dist/reset.css">
    <link rel="stylesheet" href="dist/reveal.css">
    <link rel="stylesheet" href="dist/theme/black.css">
    <link rel="stylesheet" href="dist/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="assets/css/demo.css">
    <style>body{background:var(--r-background-color)}</style>
  </head>
  <body>
    <div class="embeddemo">
      <div class="reveal" id="deck1">
        <div class="slides">
          <section class="center">
            <section class="center">
              <h2>With Smallcontrol</h2>
              <p>Small vertical controls</p>
            </section>
            <section class="center">
              <p>Only this deck has them</p>
            </section>
            <section class="center">
              <p>Smallcontrol only styles the deck it is loaded in</p>
            </section>
          </section>
          <section class="center">
            <h3>That’s it!</h3>
          </section>
        </div>
      </div>
      <div class="reveal" id="deck2">
        <div class="slides">
          <section class="center">
            <section class="center">
              <h2>Without Smallcontrol</h2>
              <p>Reveal’s own controls</p>
            </section>
            <section class="center">
              <p>This deck does not load the plugin</p>
            </section>
            <section class="center">
              <p>So it keeps the regular size</p>
            </section>
          </section>
          <section class="center">
            <h3>That’s it!</h3>
          </section>
        </div>
      </div>
    </div>
    <script src="dist/reveal.js"></script>
    <script src="plugin/smallcontrol/smallcontrol.js"></script>
    <script>
      const options = {
      	embedded: true, keyboardCondition: 'focused',
      	overview: false, controlsTutorial: false,
      	transition: "slide"
      };
      new Reveal(document.querySelector("#deck1"), { ...options, plugins: [ Smallcontrol ] }).initialize();
      new Reveal(document.querySelector("#deck2"), options).initialize();
    </script>
  </body>
</html>
